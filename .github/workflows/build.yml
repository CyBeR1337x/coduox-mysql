name: build

# Builds mysql.so and runs the tests against a MariaDB service on every push
# and pull request. Pushing a tag such as v2.2 also publishes a release with
# the built mysql.so attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # An older Ubuntu keeps the binary usable on older server distributions.
    runs-on: ubuntu-22.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Install the client library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmariadb-dev

      - name: Build
        run: make CXXFLAGS="-O2 -Werror"

      - name: Check the exported entry points
        run: |
          for symbol in coduomp_plugin_attach OnInfoRequest OnInit OnExitLevel OnTerminate; do
            nm -D --defined-only mysql.so | grep -qw "$symbol" || { echo "missing $symbol"; exit 1; }
          done

      - name: Test
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: 3306
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: test
        run: make test CXXFLAGS="-O2 -Werror"

      - uses: actions/upload-artifact@v4
        with:
          name: mysql-linux-x86_64
          path: mysql.so
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mysql-linux-x86_64

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" mysql.so
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --notes "mysql.so for 64-bit Linux. The server needs the MariaDB client library: apt install libmariadb3."
